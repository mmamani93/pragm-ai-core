name: Standalone release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
            asset: pragmai-macos-arm64.tar.gz
          - os: macos-15-intel
            label: macOS-x64
            asset: pragmai-macos-x64.tar.gz
          - os: ubuntu-22.04
            label: linux-x64
            asset: pragmai-linux-x64.tar.gz
          - os: windows-2022
            label: windows-x64
            asset: pragmai-windows-x64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install release dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run connector tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build standalone executable
        run: python scripts/build_standalone.py --clean
      - name: Verify executable starts
        run: python -c "import pathlib, subprocess, sys; exe = pathlib.Path('dist/standalone') / ('pragmai.exe' if sys.platform == 'win32' else 'pragmai'); subprocess.run([str(exe.resolve()), '--version'], check=True)"
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist/standalone -czf "${{ matrix.asset }}" pragmai
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/standalone/pragmai.exe "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "PragmAI ${GITHUB_REF_NAME#v}"
